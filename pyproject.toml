[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygrbl-build"
description = "Generate G-code for GRBL diode lasers from images and SVGs, with LaserGRBL-faithful output."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "pygrbl-build developers" }]
keywords = ["grbl", "gcode", "laser", "raster", "jarvis", "dithering", "vector", "svg", "potrace", "lasergrbl", "engraving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dynamic = ["version"]

dependencies = [
    "pillow>=11.3.0,<12",
]

[project.urls]
Homepage = "https://offerrall.github.io/pygrbl-build/"
Documentation = "https://offerrall.github.io/pygrbl-build/"
Repository = "https://github.com/offerrall/pygrbl_build"
Issues = "https://github.com/offerrall/pygrbl_build/issues"
Changelog = "https://github.com/offerrall/pygrbl_build/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pygrbl_build"]

[tool.setuptools.package-data]
pygrbl_build = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "pygrbl_build.__version__" }
